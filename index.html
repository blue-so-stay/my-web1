<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYOTO & OSAKA 2026 | 한 달 살기 프로젝트</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background-color: #f5f5f7; color: #1d1d1f; line-height: 1.6; }

        header { position: sticky; top: 0; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e5e5e5; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .logo { font-size: 20px; font-weight: 800; color: #111; }
        .nav-auth { display: flex; gap: 10px; }
        .btn { padding: 6px 14px; border-radius: 18px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-primary { background: #000; color: #fff; border-color: #000; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 28px; font-weight: 700; margin-bottom: 20px; }

        /* 관리자 전용 작성 버튼 및 모달 */
        .admin-only { display: none; margin-bottom: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }

        /* 포스트 카드 및 댓글 섹션 */
        .post-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .post-card img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin: 15px 0; }
        
        /* 이모티콘 반응 버튼 */
        .reactions { display: flex; gap: 10px; margin: 15px 0; }
        .reaction-btn { background: #f0f0f2; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 14px; }

        /* 댓글 영역 */
        .comments-section { border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }
        .comment-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dotted #ddd; font-size: 14px; }
        .comment-blocked { color: #888; font-style: italic; }
        .block-btn { color: #ff3b30; border: none; background: none; cursor: pointer; font-size: 12px; margin-left: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">JAPAN 2026</div>
            <div class="nav-auth" id="authButtons">
                <button class="btn" onclick="openAuthModal('login')">로그인</button>
                <button class="btn btn-primary" onclick="openAuthModal('signup')">회원가입</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- 관리자 전용 글 작성 영역 -->
        <div id="adminPanel" class="admin-only">
            <button class="btn btn-primary" onclick="openPostModal()">+ 새 글/사진 업로드 (관리자전용)</button>
        </div>

        <h2 class="section-title">📖 한 달 살기 일지</h2>

        <!-- 포스트 예시 구조 -->
        <div class="post-card">
            <h3>교토 첫날 도착!</h3>
            <p style="color:#666; font-size:12px;">2026.08.31 | 작성자: 관리자</p>
            <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=800" alt="교토 이미지">
            <p>드디어 교토 호스텔에 체크인했습니다. 날씨가 너무 좋네요!</p>

            <!-- 이모티콘 반응 -->
            <div class="reactions">
                <button class="reaction-btn" onclick="addReaction('like')">❤️ <span id="likeCount">12</span></button>
                <button class="reaction-btn" onclick="addReaction('fire')">🔥 <span id="fireCount">5</span></button>
                <button class="reaction-btn" onclick="addReaction('smile')">😊 <span id="smileCount">3</span></button>
            </div>

            <!-- 댓글 목록 및 작성 -->
            <div class="comments-section">
                <h4>댓글</h4>
                <div id="commentList">
                    <div class="comment-item">
                        <span><b>여행가:</b> 풍경 너무 예뻐요!</span>
                        <button class="block-btn" onclick="blockComment(this)">차단</button>
                    </div>
                </div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="commentInput" placeholder="댓글을 입력하세요..." style="flex:1; padding:8px; border:1px solid #ddd; border-radius:6px;">
                    <button class="btn btn-primary" onclick="submitComment()">등록</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 작성/수정 모달 -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <h3>새 포스트 작성</h3>
            <div class="form-group">
                <label>제목</label>
                <input type="text" id="postTitle">
            </div>
            <div class="form-group">
                <label>사진 업로드</label>
                <input type="file" id="postImage" accept="image/*">
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea id="postContent" rows="4"></textarea>
            </div>
            <button class="btn btn-primary" onclick="savePost()">업로드</button>
            <button class="btn" onclick="closeModal('postModal')">취소</button>
        </div>
    </div>

    <script>
        // 권한 체크 예시 (실제 백엔드 연결 필요)
        const currentUser = { role: 'ADMIN' }; // 'ADMIN'일 때만 글 작성 버튼 보임

        if (currentUser.role === 'ADMIN') {
            document.getElementById('adminPanel').style.display = 'block';
        }

        function openPostModal() { document.getElementById('postModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // 댓글 차단 기능 예시
        function blockComment(btn) {
            const commentItem = btn.parentElement;
            commentItem.innerHTML = `<span class="comment-blocked">차단된 댓글입니다.</span>`;
        }

        // 댓글 등록 기능 예시
        function submitComment() {
            const input = document.getElementById('commentInput');
            if (!input.value.trim()) return;

            const commentList = document.getElementById('commentList');
            const newComment = document.createElement('div');
            newComment.className = 'comment-item';
            newComment.innerHTML = `<span><b>사용자:</b> ${input.value}</span><button class="block-btn" onclick="blockComment(this)">차단</button>`;
            commentList.appendChild(newComment);
            input.value = '';
        }
    </script>
</body>
</html>
