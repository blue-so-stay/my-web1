<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYOTO & OSAKA 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; }
    
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e9ecef; z-index: 100; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
    .logo { font-size: 1.25rem; font-weight: bold; text-decoration: none; color: #111; }
    .nav-auth { display: flex; gap: 0.5rem; align-items: center; }
    .btn { padding: 6px 14px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; border: none; }
    .btn-primary { background-color: #007aff; color: white; }
    .btn-outline { background-color: transparent; border: 1px solid #ccc; }
    .user-info { font-size: 0.85rem; color: #666; margin-right: 8px; }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
    .section-title { font-size: 1.5rem; margin-bottom: 1.5rem; }

    /* 모달 스타일 */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: white; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; position: relative; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; cursor: pointer; font-size: 1.2rem; background: none; border: none; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; }
    
    /* 포스트 및 댓글 */
    .post-card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #eee; }
    .comment-section { margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem; }
    .comment-input-group { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .comment-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .comment-list { margin-top: 0.5rem; font-size: 0.9rem; color: #444; }
    .comment-item { padding: 4px 0; border-bottom: 1px dashed #f0f0f0; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="logo">KYOTO & OSAKA 2026</a>
      <div class="nav-auth" id="navAuth">
        <button class="btn btn-outline" onclick="openModal('loginModal')">로그인</button>
        <button class="btn btn-primary" onclick="openModal('signupModal')">회원가입</button>
      </div>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">여행 정보 및 댓글</h2>
    <div class="post-card">
      <h3>자유 게시판 / 일정 공유</h3>
      <p style="margin-top: 0.5rem; color: #666;">궁금한 점이나 일정을 공유하고 댓글을 남겨보세요.</p>
      
      <div class="comment-section">
        <h4>댓글</h4>
        <div class="comment-list" id="commentList">
          <div class="comment-item"><strong>익명:</strong> 첫 번째 댓글 예시입니다!</div>
        </div>
        <div class="comment-input-group">
          <input type="text" id="commentInput" class="comment-input" placeholder="댓글을 입력하세요...">
          <button class="btn btn-primary" onclick="submitComment()">등록</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 로그인 모달 -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
      <h3 style="margin-bottom: 1rem;">로그인</h3>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="loginEmail" placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="loginPassword">
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="handleLogin()">로그인</button>
    </div>
  </div>

  <!-- 회원가입 모달 -->
  <div class="modal" id="signupModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('signupModal')">✕</button>
      <h3 style="margin-bottom: 1rem;">회원가입</h3>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="signupEmail" placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="signupPassword">
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="handleSignup()">가입하기</button>
    </div>
  </div>

  <script>
    // 모달 제어
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // 임시 회원가입 / 로그인 동작
    function handleSignup() {
      const email = document.getElementById('signupEmail').value;
      if (!email) return alert('이메일을 입력하세요.');
      alert('회원가입 요청 성공! (Firebase 연결 대기)');
      closeModal('signupModal');
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      if (!email) return alert('이메일을 입력하세요.');
      
      document.getElementById('navAuth').innerHTML = `
        <span class="user-info">${email}님</span>
        <button class="btn btn-outline" onclick="location.reload()">로그아웃</button>
      `;
      closeModal('loginModal');
    }

    // 댓글 기능
    function submitComment() {
      const input = document.getElementById('commentInput');
      if (!input.value.trim()) return;
      
      const list = document.getElementById('commentList');
      const newComment = document.createElement('div');
      newComment.className = 'comment-item';
      newComment.innerHTML = `<strong>사용자:</strong> ${input.value}`;
      list.appendChild(newComment);
      input.value = '';
    }
  </script>
</body>
</html>
